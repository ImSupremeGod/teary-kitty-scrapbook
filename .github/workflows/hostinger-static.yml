name: Build Hostinger static site

on:
  workflow_dispatch:
  push:
    branches:
      - hostinger-static-deploy

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Copy Lovable-hosted media into the site
        run: node scripts/prepare-static-assets.mjs
        env:
          LOVABLE_ASSET_ORIGIN: https://teary-kitty-scrapbook.lovable.app

      - name: Build static SPA for Hostinger
        run: bunx vite build --config vite.config.hostinger.ts

      - name: Verify and prepare static site
        shell: bash
        run: |
          set -euo pipefail

          if [ -f dist/client/_shell.html ]; then
            SITE_DIR="dist/client"
          elif [ -f .output/public/_shell.html ]; then
            SITE_DIR=".output/public"
          elif [ -f dist/client/index.html ]; then
            SITE_DIR="dist/client"
          elif [ -f .output/public/index.html ]; then
            SITE_DIR=".output/public"
          else
            echo "Could not find the generated SPA shell or index.html."
            echo "Build output:"
            find dist .output -maxdepth 5 -type f 2>/dev/null | head -200 || true
            exit 1
          fi

          if [ -f "$SITE_DIR/_shell.html" ]; then
            cp "$SITE_DIR/_shell.html" "$SITE_DIR/index.html"
          fi

          test -f "$SITE_DIR/index.html"
          test -d "$SITE_DIR/lovable-assets"
          if grep -R -nE '/__l5e/assets-v1/' "$SITE_DIR"; then
            echo "Found unresolved Lovable asset URLs in output."
            exit 1
          fi

          cat > "$SITE_DIR/.htaccess" <<'HTACCESS'
          Options -Indexes
          DirectoryIndex index.html
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            RewriteRule ^ index.html [L]
          </IfModule>
          <IfModule mod_mime.c>
            AddType image/webp .webp
            AddType image/gif .gif
            AddType audio/mpeg .mp3
            AddType video/mp4 .mp4
          </IfModule>
          <IfModule mod_headers.c>
            Header always set X-Robots-Tag "noindex, nofollow, noarchive"
          </IfModule>
          HTACCESS

          mkdir -p package
          cp -a "$SITE_DIR"/. package/
          echo "SITE_DIR=$SITE_DIR" >> "$GITHUB_ENV"

      - name: Package files for Hostinger
        run: |
          cd package
          zip -r ../hostinger-site.zip .

      - name: Upload Hostinger package
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-site
          path: hostinger-site.zip
          if-no-files-found: error
          retention-days: 14
